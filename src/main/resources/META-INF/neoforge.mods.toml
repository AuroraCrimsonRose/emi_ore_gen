modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/AuroraTejeda/emioregeneration/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Aurora Tejeda"
description='''
Adds an Ore Generation category to EMI showing where every ore actually spawns.

Look up any ore to see its depth range on a chart, cycle through the dimensions and biomes
it generates in, and read off vein size, how often the vein spawns, and how much of that
vein the ore makes up. Supports vanilla and mod ore features, plus GregTech CEu ore veins,
bedrock ore deposits, bedrock fluid reservoirs, and the surface rocks that mark them.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# EMI is the display surface, so there is nothing to show without it.
[[dependencies.${mod_id}]]
    modId="emi"
    type="required"
    versionRange="[1.1.0,)"
    ordering="AFTER"
    side="CLIENT"

# Optional integrations. Ordering matters: these must finish registering their worldgen
# before this mod indexes it.
[[dependencies.${mod_id}]]
    modId="gtceu"
    type="optional"
    versionRange="[8.0.0,)"
    ordering="AFTER"
    side="BOTH"
